# ---------------------------------------------------------------------------
# Bifrost release pipeline: CI -> build (GHCR, linux/arm64) -> deploy to VM2.
#
# This workflow does not run tests of its own. It starts from a completed run
# of ci.yml, which owns the whole verification matrix (test / lint / security),
# and it only proceeds when that run finished successfully. A release is
# therefore always cut from a commit whose entire CI passed, not merely from a
# commit whose unit tests passed.
# ---------------------------------------------------------------------------
name: Release

on:
  # A GitHub workflow run reaches the `success` conclusion only when every job
  # in it succeeded, so "ci.yml concluded success for this commit" is exactly
  # the same-SHA gate the release path needs. No aggregating job is required in
  # ci.yml: its test, lint and security jobs all run unconditionally, and a
  # failure in any one of them turns the run conclusion into `failure`.
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Existing ghcr.io/bngdrasil/bifrost tag to deploy without rebuilding,
          for example "sha-1a2b3c4". Used for rollbacks.
        required: false
        type: string
        default: ""
      skip_build:
        description: >-
          Skip the build job and deploy image_tag as it is. image_tag is
          required when this is checked.
        required: false
        type: boolean
        default: false

# Every job narrows this further. The default is read-only.
permissions:
  contents: read

# Releases for the same ref queue up instead of cancelling each other, because
# a cancelled run could leave VM2 half way through a container replacement.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/bngdrasil/bifrost
  # docker compose service name on VM2 (/opt/bnbong/docker-compose.yml).
  SERVICE_NAME: gateway

jobs:
  # Resolves three things once, in shell, so that the later jobs compare plain
  # strings: which commit is being released, whether a new image has to be
  # built, and whether that commit is allowed to be released at all.
  plan:
    name: Resolve release plan
    # workflow_run is delivered for every completed CI run, including failed
    # and cancelled ones, so the conclusion is checked here and the whole job
    # graph is skipped when it is not `success`. build and deploy both depend
    # on plan, and deploy additionally requires needs.plan.result == 'success',
    # so a skipped plan cannot be followed by a deployment.
    #
    # SECURITY: a workflow_run run executes from the default branch with a
    # write-capable token and full access to secrets, even when the CI run that
    # triggered it came from a fork pull request. The `branches: [ main ]`
    # filter matches the head branch of the CI run, and a fork's pull request
    # branch can itself be named "main", so the triggering event and the head
    # repository are checked as well. Only a push to main in this repository
    # may reach build and deploy.
    if: >-
      github.event_name != 'workflow_run'
      || (
        github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    permissions:
      # The manual path reads the CI result of the dispatched commit through
      # the Actions API.
      contents: read
      actions: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      image_ref: ${{ steps.plan.outputs.image_ref }}
      sha: ${{ steps.commit.outputs.sha }}
      short_sha: ${{ steps.commit.outputs.short_sha }}
      is_main: ${{ steps.commit.outputs.is_main }}
    steps:
      - name: Resolve the commit under release
        id: commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # On a workflow_run event GITHUB_SHA and GITHUB_REF describe the
          # default branch as it stood when the event was delivered, not the
          # commit CI actually verified. Those two can differ as soon as a
          # second push lands, so everything downstream uses head_sha instead.
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            sha="${RUN_HEAD_SHA:-}"
            branch="${RUN_HEAD_BRANCH:-}"
          else
            sha="${DISPATCH_SHA:-}"
            branch="${DISPATCH_REF#refs/heads/}"
          fi

          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Could not resolve a 40 character commit SHA for this run (got '${sha}')." >&2
            exit 1
          fi

          is_main=false
          if [ "$branch" = "main" ]; then
            is_main=true
          fi

          {
            echo "sha=${sha}"
            echo "short_sha=${sha:0:7}"
            echo "branch=${branch}"
            echo "is_main=${is_main}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${sha} from branch '${branch}'."

      - name: Decide whether to build
        id: plan
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          SKIP_BUILD: ${{ inputs.skip_build }}
        run: |
          set -euo pipefail
          image_tag="${IMAGE_TAG:-}"
          skip_build="${SKIP_BUILD:-false}"

          if [ -n "$image_tag" ] || [ "$skip_build" = "true" ]; then
            if [ -z "$image_tag" ]; then
              echo "::error::skip_build was requested without an image_tag." >&2
              exit 1
            fi
            # Reject anything that is not a plain OCI tag, because the value
            # ends up in a remote command line.
            case "$image_tag" in
              *[!A-Za-z0-9._-]*)
                echo "::error::image_tag may only contain A-Z a-z 0-9 . _ and -" >&2
                exit 1
                ;;
            esac
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "image_ref=${IMAGE_NAME}:${image_tag}" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "image_ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Require a successful CI run for this commit
        # Only the manual "build new code" path needs this. The workflow_run
        # path is already gated by the job-level `if`, and the image_tag path
        # redeploys an image that was itself built through one of those gates.
        if: github.event_name == 'workflow_dispatch' && steps.plan.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          # The query is pinned to head_sha, so this asks "did CI pass on this
          # exact commit". The most recent success of CI on some other commit
          # is deliberately not accepted: that is the hole this check closes.
          runs="$(gh api --paginate \
            "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=100" \
            --jq '.workflow_runs[] | [.status, .conclusion, .html_url] | @tsv')"

          if [ -z "$runs" ]; then
            echo "::error::No CI workflow run exists for ${SHA}. Push the commit and let CI finish before releasing it." >&2
            exit 1
          fi

          echo "CI runs found for ${SHA}:"
          printf '%s\n' "$runs"

          unfinished="$(printf '%s\n' "$runs" | awk -F'\t' '$1 != "completed"' | wc -l | tr -d ' ')"
          if [ "$unfinished" != "0" ]; then
            echo "::error::CI for ${SHA} has not finished yet (${unfinished} run(s) still in progress). Wait for it and dispatch again." >&2
            exit 1
          fi

          unsuccessful="$(printf '%s\n' "$runs" | awk -F'\t' '$2 != "success"' | wc -l | tr -d ' ')"
          if [ "$unsuccessful" != "0" ]; then
            echo "::error::CI for ${SHA} did not succeed (${unsuccessful} run(s) concluded with something other than success). Refusing to release this commit." >&2
            exit 1
          fi

          echo "CI succeeded for ${SHA}."

  build:
    name: Build and push image
    needs: plan
    if: needs.plan.outputs.build == 'true'
    # Native arm64 runner. VM2 is aarch64, so no emulation is involved and the
    # build takes roughly as long as it does on x86.
    #
    # If this runner label ever becomes unavailable (it requires a public
    # repository), fall back to emulation by adding the QEMU step below and
    # keeping the same platforms value:
    #
    #   - name: Set up QEMU
    #     uses: docker/setup-qemu-action@v3
    #     with:
    #       platforms: arm64
    #
    # The emulated build is several times slower, so treat it as a stopgap.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.ref.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The verified commit, not github.sha. On a workflow_run event
          # github.sha is the default branch head at delivery time, which may
          # already have moved past the commit CI approved.
          ref: ${{ needs.plan.outputs.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # Spelled out as raw values because the built-in type=sha reads
          # github.sha, which is the wrong commit on a workflow_run event.
          tags: |
            type=raw,value=sha-${{ needs.plan.outputs.short_sha }}
            type=raw,value=main,enable=${{ needs.plan.outputs.is_main == 'true' }}
          labels: |
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # Docker 28 on VM2 pulls these images directly. Attestation
          # manifests would turn the tag into an index that older tooling
          # reads as a multi-platform image with no usable entry.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish the digest reference
        id: ref
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "image_ref=${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to VM2
    needs: [ plan, build ]
    # Runs after a successful build, or straight after plan when an existing
    # tag is being redeployed. Written out in full so that a skipped plan,
    # which is how a failed or forged CI run is rejected, cannot reach deploy.
    if: >-
      always()
      && needs.plan.result == 'success'
      && (
        (needs.plan.outputs.build == 'true' && needs.build.result == 'success')
        || (needs.plan.outputs.build == 'false' && needs.build.result == 'skipped')
      )
    runs-on: ubuntu-latest
    # Approvals, wait timers and the deployment branch policy are configured on
    # this environment in the repository settings, not here.
    environment: production
    # VM2 holds one docker compose project, so two releases must not replace
    # containers at the same time. Queue instead of cancelling: a cancelled
    # deploy could leave the rollback half done.
    concurrency:
      group: vm2-deploy
      cancel-in-progress: false
    permissions: {}
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VM2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/vm2_deploy_key
          chmod 600 ~/.ssh/vm2_deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve the image reference
        id: image
        env:
          BUILD_IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          PLAN_IMAGE_REF: ${{ needs.plan.outputs.image_ref }}
        run: |
          set -euo pipefail
          image_ref="${BUILD_IMAGE_REF:-}"
          if [ -z "$image_ref" ]; then
            image_ref="${PLAN_IMAGE_REF:-}"
          fi
          if [ -z "$image_ref" ]; then
            echo "::error::No image reference to deploy." >&2
            exit 1
          fi
          case "$image_ref" in
            *[!A-Za-z0-9._/:@-]*)
              echo "::error::Refusing to deploy an image reference with shell metacharacters." >&2
              exit 1
              ;;
          esac
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${image_ref}"

      - name: Replace the container on VM2
        env:
          VM2_HOST: ${{ secrets.VM2_HOST }}
          VM2_USER: ${{ secrets.VM2_USER || 'ubuntu' }}
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          set -euo pipefail
          # deploy-image.sh (installed from the Baedalus repository) pulls the
          # image, tags the previous one for rollback, updates GATEWAY_IMAGE in
          # /opt/bnbong/.env, recreates the service and probes /health and
          # /ready. It rolls back and exits non-zero on failure, so the exit
          # code is the only signal this step needs.
          ssh -i ~/.ssh/vm2_deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              "${VM2_USER}@${VM2_HOST}" \
              "sudo /opt/bnbong/deploy-image.sh ${SERVICE_NAME} ${IMAGE_REF}"

      - name: Smoke check through the public endpoint
        run: |
          set -euo pipefail
          # The VM1 Nginx "location /" block on api.bnbong.com proxies to the
          # gateway upstream, so this exercises Cloudflare, Nginx and Bifrost
          # in one request. deploy-image.sh has already checked /health and
          # /ready on the host itself.
          curl -fsS --max-time 15 https://api.bnbong.com/health

      - name: Remove the deploy key
        if: always()
        run: rm -f ~/.ssh/vm2_deploy_key

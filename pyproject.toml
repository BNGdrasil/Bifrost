[project]
name = "bifrost"
dynamic = ["version"]
description = "API gateway server"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "bnbong", email = "bbbong9@gmail.com" }
]
license = "MIT"
keywords = ["python", "fastapi", "api", "gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Runtime dependencies only. Authentication and authorisation are delegated to
# the Bidar auth server, so no JWT or password hashing library is needed here.
dependencies = [
    "fastapi>=0.115.6",
    "starlette>=0.41.3",
    "uvicorn[standard]>=0.32.1",
    "httpx>=0.28.1",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.1",
    "greenlet>=3.1.1",
]

[project.urls]
"Source" = "https://github.com/BNGdrasil/Bifrost"
"Homepage" = "https://bnbong.com"
"Bug Reports" = "https://github.com/BNGdrasil/Bifrost/issues"

[project.scripts]
bifrost = "src.main:main"

[dependency-groups]
dev = [
    "alembic>=1.14.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "types-setuptools>=75.0",
    "fastapi-fastkit>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "code"
path = "src/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]
skip_glob = [".venv/*", "build/*", "dist/*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.bandit]
exclude_dirs = [".venv", "tests", "build", "dist", "htmlcov"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]
